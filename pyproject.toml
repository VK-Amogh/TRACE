[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace-sec"
version = "2.1.4"
description = "Threat Reconnaissance & Attack-path Correlation Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TRACE Core Team" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "networkx>=3.2.0",
    "httpx>=0.27.0",
    "orjson>=3.9.0",
    "tomli-w>=1.0.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-language-pack>=0.2.0",
]

[project.scripts]
trace = "trace_engine.cli:app"
Trace = "trace_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::RuntimeWarning:laya.*",
]
