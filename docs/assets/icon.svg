<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" shape-rendering="crispEdges">
  <style>
    .px { fill: #000000; }
    @media (prefers-color-scheme: dark) {
      .px { fill: #FFFFFF; }
    }
  </style>
  <g class="px">
    <!-- Center Crosshairs (Continuous through x=45 and y=45) -->
    <rect x="45" y="10" width="5" height="75"/>
    <rect x="10" y="45" width="75" height="5"/>

    <!-- Outer Ring: Cardinal Edges (Top, Bottom, Left, Right) -->
    <rect x="35" y="10" width="25" height="5"/>
    <rect x="35" y="80" width="25" height="5"/>
    <rect x="10" y="35" width="5" height="25"/>
    <rect x="80" y="35" width="5" height="25"/>

    <!-- Outer Ring: Top-Left Staircase -->
    <rect x="25" y="15" width="10" height="5"/>
    <rect x="20" y="20" width="5" height="5"/>
    <rect x="15" y="25" width="5" height="10"/>

    <!-- Outer Ring: Bottom-Left Staircase -->
    <rect x="15" y="60" width="5" height="10"/>
    <rect x="20" y="70" width="5" height="5"/>
    <rect x="25" y="75" width="10" height="5"/>

    <!-- Outer Ring: Bottom-Right Staircase -->
    <rect x="60" y="75" width="10" height="5"/>
    <rect x="70" y="70" width="5" height="5"/>
    <rect x="75" y="60" width="5" height="10"/>

    <!-- Inner Ring: 4 Cardinal Edges -->
    <rect x="35" y="25" width="25" height="5"/>
    <rect x="35" y="65" width="25" height="5"/>
    <rect x="25" y="35" width="5" height="25"/>
    <rect x="65" y="35" width="5" height="25"/>

    <!-- Inner Ring: 4 Symmetric Corner Steps -->
    <rect x="30" y="30" width="5" height="5"/>
    <rect x="60" y="30" width="5" height="5"/>
    <rect x="30" y="60" width="5" height="5"/>
    <rect x="60" y="60" width="5" height="5"/>

    <!-- Detached Top-Right Hollow Target Box -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M67 10H85V28H67V10ZM70.5 13.5V24.5H81.5V13.5H70.5Z"/>
  </g>
</svg>
