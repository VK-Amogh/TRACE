<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="trace-grad" x1="12" y1="52" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.2" />
      <stop offset="55%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="beam-grad" x1="16" y1="48" x2="46" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0" />
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>

  <!-- Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0B0F17" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle Precision Grid Ticks (Corner Registration Marks) -->
  <path d="M12 16V12H16 M52 48V52H48" stroke="#1E293B" stroke-width="1.5" stroke-linecap="square" />

  <!-- Outer Execution Layer (Muted) -->
  <path d="M16 30V48H34" stroke="#14B8A6" stroke-opacity="0.3" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter" />

  <!-- Middle Execution Layer (Teal) -->
  <path d="M22 24V42H40" stroke="#14B8A6" stroke-opacity="0.65" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter" />

  <!-- Inner Active Layer (Ice Teal) -->
  <path d="M28 18V36H46" stroke="#2DD4BF" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter" />

  <!-- The Trace Vector (Intercept Line) -->
  <line x1="16" y1="48" x2="43" y2="21" stroke="url(#beam-grad)" stroke-width="3" stroke-linecap="round" />

  <!-- Intercept Lock Node (Precision Diamond Reticle at Apex) -->
  <rect x="46" y="12" width="8" height="8" rx="1.5" transform="rotate(45 46 12)" fill="#0B0F17" stroke="#2DD4BF" stroke-width="2.5" />
  <circle cx="46" cy="17.65" r="1.5" fill="#F8FAFC" />
</svg>
