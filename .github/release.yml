changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot, github-actions]
  categories:
    - title: "Breaking changes"
      labels: [breaking]
    - title: "Features"
      labels: [enhancement, feature]
    - title: "Fixes"
      labels: [bug, fix]
    - title: "Security"
      labels: [security]
    - title: "Documentation"
      labels: [documentation]
    - title: "Other changes"
      labels: ["*"]
