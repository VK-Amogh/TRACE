name: "Release: PyPI + NPM"

# Cutting a release:
#   1. Bump src/trace_engine/__init__.py:__version__ AND package.json together.
#   2. Commit, tag v<version> (e.g. v2.1.19), push tag.
#   3. Publish a GitHub release from the tag -> this workflow verifies the
#      tag matches both manifests, then publishes to PyPI (trusted
#      publishing: configure auraflaa/TRACE once at pypi.org/manage/account/
#      publishing) and NPM (needs NPM_TOKEN secret; skipped when absent).
# Manual runs via workflow_dispatch skip the tag check.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  version-check:
    name: "Tag matches manifests"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'release'
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: "Verify tag matches package versions"
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          PY=$(python -c "import sys; sys.path.insert(0, 'src'); import trace_engine; print(trace_engine.__version__)")
          echo "tag=$TAG package.json=$PKG python=$PY"
          test "$TAG" = "$PKG" || { echo "::error::package.json ($PKG) != tag ($TAG)"; exit 1; }
          test "$TAG" = "$PY" || { echo "::error::__version__ ($PY) != tag ($TAG)"; exit 1; }

  preflight:
    name: "Preflight (lint + test + pack)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: "Install + test lite package"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          PYTHONPATH=src python -m pytest tests/test_trace.py tests/test_bugs_and_edge_cases.py tests/test_skills_package.py -q
        env:
          HF_HUB_OFFLINE: "1"

      - name: "Node checks + pack"
        run: |
          node --check bin/trace.js
          node --check bin/lib/config.js
          node --check bin/lib/python.js
          node --check bin/lib/venv.js
          node --check bin/lib/skills.js
          npm pack --dry-run

  publish-npm:
    name: "Publish to Public NPM Registry"
    needs: [preflight]
    # Skip (don't fail) when no NPM account is configured; real registry
    # errors still fail the step.
    if: ${{ secrets.NPM_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: "Publish trace-sec to NPM"
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-packages:
    name: "Publish to GitHub Packages Registry"
    needs: [preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://npm.pkg.github.com"

      - name: "Publish trace-sec to GitHub Packages"
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: "Publish to PyPI (trusted publishing)"
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: release
      url: https://pypi.org/project/trace-sec/
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Build sdist + wheel"
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: "Publish to PyPI"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
