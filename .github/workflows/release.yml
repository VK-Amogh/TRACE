name: "Release: GitHub + PyPI + npm"

# Cutting a release:
#   1. python scripts/release_tools.py bump X.Y.Z   (syncs __init__.py, package.json, CHANGELOG)
#   2. Commit to main via PR, then:  git tag vX.Y.Z && git push origin vX.Y.Z
#   3. This workflow verifies the tag, tests, builds once, publishes to PyPI
#      (trusted publishing) and npm (provenance), then creates the GitHub Release
#      with CHANGELOG notes, artifacts, and build-provenance attestations.
# One-time setup: see docs/releases.md (PyPI trusted publisher, NPM_TOKEN secret,
# `release` environment with required reviewers).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only; do not publish"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: "Verify version"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: "Manifests agree and match tag"
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python scripts/release_tools.py check "${GITHUB_REF_NAME}"
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
              || { echo "::error::tag is not reachable from main"; exit 1; }
          else
            python scripts/release_tools.py check
          fi

  test:
    name: "Test (${{ matrix.os }})"
    needs: [verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: "Install and run tests"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest tests/ -q -rf
        env:
          PYTHONPATH: src
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
      - name: "Node syntax check"
        shell: bash
        run: |
          for f in bin/trace.js bin/postinstall.js bin/lib/*.js; do node --check "$f"; done

  build:
    name: "Build artifacts"
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: "Build sdist + wheel, validate metadata"
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: "Pack npm tarball"
        run: |
          mkdir -p npm-dist
          npm pack --pack-destination npm-dist
      - name: "Checksums"
        run: |
          cd dist && sha256sum * > ../SHA256SUMS.txt
          cd ../npm-dist && sha256sum * >> ../SHA256SUMS.txt
      - name: "Attest build provenance"
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*
            npm-dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: npm-dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: SHA256SUMS.txt
          if-no-files-found: error

  publish-pypi:
    name: "Publish to PyPI"
    needs: [build]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://pypi.org/project/trace-sec/
    permissions:
      # Mandatory for OIDC trusted publishing to PyPI.
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: "Publish to PyPI (OIDC trusted publishing, or PYPI_API_TOKEN)"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Token takes precedence when set; otherwise OIDC is used.
          # Configure the PyPI trusted publisher as:
          #   owner: VK-Amogh, repo: TRACE,
          #   workflow: release.yml, environment: release.
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  publish-npm:
    name: "Publish to npm"
    needs: [build]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://www.npmjs.com/package/trace-sec
    permissions:
      # OIDC trusted publishing to npm needs id-token; attestations
      # need contents + the package.json provenance flag (already set).
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          # OIDC trusted publishing requires npm >= 11.5.1.
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
      - name: "Update npm for OIDC support"
        run: npm install -g "npm@>=11.5.1"
      - name: "Publish to npm (OIDC trusted publishing, or NPM_TOKEN)"
        run: |
          if npm view "trace-sec@$(node -p "require('./package.json').version)" version >/dev/null 2>&1; then
            echo "trace-sec@$(node -p "require('./package.json').version") already on npm - skipping."
            exit 0
          fi
          TAG=latest
          case "$(node -p "require('./package.json').version")" in *-*) TAG=next ;; esac
          if [ -n "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN is set - publishing with token auth."
            npm publish --access public --provenance --tag "${TAG}"
          else
            echo "NPM_TOKEN unset - publishing with OIDC trusted publishing."
            npm publish --access public --provenance --tag "${TAG}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: "Create GitHub Release"
    needs: [publish-pypi, publish-npm]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: "Extract release notes"
        run: python scripts/release_tools.py notes "${GITHUB_REF_NAME}" > RELEASE_NOTES.md
      - name: "Publish release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRE=""
          case "${GITHUB_REF_NAME}" in *-*) PRE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "TRACE ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --generate-notes \
            --verify-tag ${PRE}
