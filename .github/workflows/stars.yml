name: "stars"

# Refreshes the star-history chart snapshot every day so the README graph
# never goes stale behind image-proxy caches. Commits only when the SVG
# actually changed. Runs on schedule plus manual dispatch.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: stars-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    name: "refresh star chart"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: "Download fresh star-history SVG"
        run: |
          curl -fsSL "https://api.star-history.com/svg?repos=VK-Amogh/TRACE&type=Date" -o docs/assets/star-history.svg
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('docs/assets/star-history.svg'); print('SVG_OK')"

      - name: "Commit when changed"
        run: |
          if git diff --quiet -- docs/assets/star-history.svg; then
            echo "Star chart unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/assets/star-history.svg
            git commit -m "docs: refresh star-history chart snapshot"
            git push
          fi
