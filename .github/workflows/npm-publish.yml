name: "Publish TRACE to NPM & GitHub Packages"

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  preflight:
    name: "Preflight (lint + test + pack)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: "Install + test lite package"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          PYTHONPATH=src python -m pytest tests/test_trace.py tests/test_bugs_and_edge_cases.py -q
        env:
          HF_HUB_OFFLINE: "1"

      - name: "Node checks + pack"
        run: |
          node --check bin/trace.js
          npm pack --dry-run

  publish-npm:
    name: "Publish to Public NPM Registry"
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: "Publish @vk.amogh/trace to NPM"
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-packages:
    name: "Publish to GitHub Packages Registry"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://npm.pkg.github.com"

      - name: "Publish @vk-amogh/trace to GitHub Packages"
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
